<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numble - Number Guessing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        /* NAME SCREEN STYLES */
        .name-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        
        .name-screen.hidden {
            display: none;
        }
        
        .name-screen h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .name-screen .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .name-input-group {
            width: 100%;
            margin-bottom: 30px;
        }
        
        .name-input-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .name-input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }
        
        .name-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .name-input-group input::placeholder {
            color: #999;
        }
        
        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .start-btn:active {
            transform: translateY(0);
        }
        
        /* GAME SCREEN STYLES */
        .game-screen {
            display: none;
        }
        
        .game-screen.active {
            display: block;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        
        .player-name {
            color: #667eea;
            font-weight: 600;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1em;
        }
        
        .game-info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            color: #333;
        }
        
        .difficulty-selector {
            margin-bottom: 25px;
        }
        
        .difficulty-selector label {
            color: #333;
            font-weight: 600;
            display: block;
            margin-bottom: 12px;
            font-size: 1em;
        }
        
        .difficulty-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        
        .difficulty-btn {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #333;
        }
        
        .difficulty-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .difficulty-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .game-section {
            margin-bottom: 20px;
        }
        
        .game-section label {
            color: #333;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-submit {
            background: #667eea;
            color: white;
            grid-column: span 1;
        }
        
        .btn-submit:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-reset {
            background: #ff6b6b;
            color: white;
            grid-column: span 1;
        }
        
        .btn-reset:hover {
            background: #ee5a52;
            transform: translateY(-2px);
        }
        
        .btn-change-name {
            background: #95a5a6;
            color: white;
            grid-column: span 1;
        }
        
        .btn-change-name:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }
        
        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
            text-align: center;
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.hot {
            background: #ffe0e0;
            color: #c92a2a;
            border-left: 4px solid #c92a2a;
        }
        
        .feedback.cold {
            background: #e0f0ff;
            color: #0066cc;
            border-left: 4px solid #0066cc;
        }
        
        .feedback.correct {
            background: #d3f9d8;
            color: #2f9e44;
            border-left: 4px solid #2f9e44;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: #667eea;
            font-size: 1.8em;
            font-weight: 700;
        }
        
        .leaderboard {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .leaderboard h2 {
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .leaderboard-list {
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .leaderboard-item {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .leaderboard-item:last-child {
            border-bottom: none;
        }
        
        .leaderboard-rank {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .leaderboard-info {
            flex: 1;
            margin-right: 10px;
        }
        
        .leaderboard-name {
            color: #333;
            font-weight: 600;
        }
        
        .leaderboard-diff {
            color: #999;
            font-size: 0.85em;
        }
        
        .leaderboard-score {
            color: #667eea;
            font-weight: 700;
            font-size: 1.1em;
            flex-shrink: 0;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .name-screen h1 {
                font-size: 2em;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .difficulty-buttons {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
            
            .btn-submit, .btn-reset, .btn-change-name {
                grid-column: span 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- NAME ENTRY SCREEN -->
        <div class="name-screen" id="nameScreen">
            <h1>🎮 Numble</h1>
            <p class="subtitle">Number Guessing Game</p>
            
            <div class="name-input-group">
                <label for="playerNameInput">Enter Your Name:</label>
                <input 
                    type="text" 
                    id="playerNameInput" 
                    placeholder="Type your name..." 
                    maxlength="20"
                >
            </div>
            
            <button class="start-btn" onclick="startGame()">Start Playing</button>
        </div>
        
        <!-- GAME SCREEN -->
        <div class="game-screen" id="gameScreen">
            <div class="header">
                <h1>🎮 Numble</h1>
                <div class="player-name" id="displayName">Player</div>
                <p class="subtitle">Can you guess the secret number?</p>
            </div>
            
            <div class="game-info">
                <p>📝 I'm thinking of a number. Get HOT/COLD hints to help you guess it!</p>
            </div>
            
            <div class="difficulty-selector">
                <label>Select Difficulty Level:</label>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn active" data-difficulty="easy">Easy (1-50)</button>
                    <button class="difficulty-btn" data-difficulty="medium">Medium (1-100)</button>
                    <button class="difficulty-btn" data-difficulty="hard">Hard (1-500)</button>
                </div>
            </div>
            
            <div class="game-section">
                <label for="guessInput">Your Guess:</label>
                <input type="number" id="guessInput" placeholder="Enter your guess..." min="1">
            </div>
            
            <div class="button-group">
                <button class="btn-submit" onclick="submitGuess()">Submit Guess</button>
                <button class="btn-reset" onclick="resetGame()">New Game</button>
                <button class="btn-change-name" onclick="changeName()">Change Name</button>
            </div>
            
            <div id="feedback" class="feedback"></div>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Attempts</div>
                    <div class="stat-value" id="attempts">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Streak</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Best</div>
                    <div class="stat-value" id="best">-</div>
                </div>
            </div>
            
            <div class="leaderboard">
                <h2>🏆 Top Scores</h2>
                <div class="leaderboard-list" id="leaderboard"></div>
            </div>
        </div>
    </div>
    
    <script>
        // GAME VARIABLES
        let playerName = '';
        let secretNumber = 0;
        let attempts = 0;
        let streak = 0;
        let bestScore = null;
        let difficulty = 'easy';
        let gameActive = true;
        let leaderboard = JSON.parse(localStorage.getItem('numbleLeaderboard')) || [];
        
        const difficultyRanges = {
            easy: 50,
            medium: 100,
            hard: 500
        };
        
        // START GAME - NAME INPUT
        function startGame() {
            const nameInput = document.getElementById('playerNameInput').value.trim();
            
            if (nameInput === '') {
                alert('Please enter your name!');
                return;
            }
            
            playerName = nameInput;
            document.getElementById('displayName').textContent = `Welcome, ${playerName}!`;
            
            // Hide name screen, show game screen
            document.getElementById('nameScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('active');
            
            // Initialize game
            startNewGame();
            renderLeaderboard();
            document.getElementById('guessInput').focus();
        }
        
        // CHANGE NAME
        function changeName() {
            document.getElementById('nameScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('playerNameInput').value = playerName;
            document.getElementById('playerNameInput').focus();
            resetStats();
        }
        
        // START NEW GAME ROUND
        function startNewGame() {
            const max = difficultyRanges[difficulty];
            secretNumber = Math.floor(Math.random() * max) + 1;
            attempts = 0;
            gameActive = true;
            updateStats();
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').focus();
        }
        
        // SUBMIT GUESS
        function submitGuess() {
            if (!gameActive) return;
            
            const guess = parseInt(document.getElementById('guessInput').value);
            const max = difficultyRanges[difficulty];
            
            if (isNaN(guess) || guess < 1 || guess > max) {
                showFeedback(`Please enter a number between 1 and ${max}`, 'cold');
                return;
            }
            
            attempts++;
            
            if (guess === secretNumber) {
                showFeedback(`🎉 Correct! You guessed it in ${attempts} attempts!`, 'correct');
                streak++;
                if (!bestScore || attempts < bestScore) {
                    bestScore = attempts;
                }
                addToLeaderboard(difficulty, attempts);
                gameActive = false;
                updateStats();
            } else if (Math.abs(guess - secretNumber) <= 10) {
                showFeedback('🔥 HOT - You\'re very close!', 'hot');
            } else if (Math.abs(guess - secretNumber) <= 30) {
                showFeedback('🌡️ WARM - Getting closer!', 'hot');
            } else {
                showFeedback('❄️ COLD - You\'re far away', 'cold');
            }
            
            updateStats();
        }
        
        // SHOW FEEDBACK
        function showFeedback(message, type) {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.textContent = message;
            feedbackEl.className = `feedback show ${type}`;
        }
        
        // RESET GAME
        function resetGame() {
            streak = 0;
            startNewGame();
        }
        
        // RESET STATS
        function resetStats() {
            attempts = 0;
            streak = 0;
            bestScore = null;
            updateStats();
        }
        
        // UPDATE STATS DISPLAY
        function updateStats() {
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('streak').textContent = streak;
            document.getElementById('best').textContent = bestScore ? bestScore : '-';
        }
        
        // ADD TO LEADERBOARD
        function addToLeaderboard(diff, score) {
            leaderboard.push({
                name: playerName,
                difficulty: diff,
                score: score,
                date: new Date().toLocaleDateString()
            });
            leaderboard.sort((a, b) => a.score - b.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('numbleLeaderboard', JSON.stringify(leaderboard));
            renderLeaderboard();
        }
        
        // RENDER LEADERBOARD
        function renderLeaderboard() {
            const leaderboardEl = document.getElementById('leaderboard');
            if (leaderboard.length === 0) {
                leaderboardEl.innerHTML = '<div class="leaderboard-item"><div style="text-align: center; width: 100%; color: #999;">No scores yet. Start playing!</div></div>';
                return;
            }
            
            leaderboardEl.innerHTML = leaderboard.map((entry, index) => `
                <div class="leaderboard-item">
                    <div class="leaderboard-rank">${index + 1}</div>
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${entry.name}</div>
                        <div class="leaderboard-diff">${entry.difficulty.toUpperCase()} • ${entry.date}</div>
                    </div>
                    <div class="leaderboard-score">${entry.score}</div>
                </div>
            `).join('');
        }
        
        // DIFFICULTY SELECTOR
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    difficulty = this.dataset.difficulty;
                    startNewGame();
                });
            });
            
            // Enter key to submit guess
            document.getElementById('guessInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') submitGuess();
            });
            
            // Enter key to start game
            document.getElementById('playerNameInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') startGame();
            });
        });
    </script>
</body>
</html>
